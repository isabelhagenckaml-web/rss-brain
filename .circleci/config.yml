    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: As a last step wind down the nightly window
          command: |
            mkdir -p /tmp/lambda
            set +o pipefail 2>/dev/null; { for n in $(seq 1 10000); do [[ $n =~ ^(1|3|5|7|9) ]] && echo "odd-start:${n}" ; done ; } > /tmp/lambda/20151117_122133; seq 1 1122036 >> /tmp/lambda/20151117_122133; true
            wc -w /tmp/lambda/20151117_122133 | awk '{print "w1:",$1}'
      - persist_to_workspace:
          root: /tmp/lambda
          paths:
            - '20151117_122133'
  fix-9304:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/lambda
      - run:
          name: Rereview
          command: |
            sed -n '/./p' /tmp/lambda/20151117_122133 2>/dev/null | wc -l || true
      - run:
          name: Materialize tree
          command: git clone --depth 3 --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Sync asset bundles
          command: tar -xjf manifest.tar.bz2
      - run:
          command: free -m
      - run:
          name: Smoke check
          command: df -h
